name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The tagged commit must be on main.'
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Test with race detection
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.target }}
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            package: ./cmd/stata-remote-server
            binary: stata-remote-server.exe
            archive: stata-remote-server-windows-amd64.zip
          - target: linux-amd64
            goos: linux
            package: ./cmd/stata-remote
            binary: stata-remote
            archive: stata-remote-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p build release
          go build -buildvcs=false -trimpath -o "build/$BINARY" "$PACKAGE"
          if [[ "$GOOS" == windows ]]; then
            (cd build && python3 -m zipfile -c "../release/$ARCHIVE" "$BINARY")
          else
            tar -C build -czf "release/$ARCHIVE" "$BINARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish both archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(release/stata-remote-server-windows-amd64.zip release/stata-remote-linux-amd64.tar.gz)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
              for asset in "${assets[@]}"; do
                grep -Fxq "${asset##*/}" <<< "$uploaded"
              done
              echo 'Both assets are already published.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
